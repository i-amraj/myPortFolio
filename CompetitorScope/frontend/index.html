<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompetitorScope - Local Competitor Intelligence Tool</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Style Sheet -->
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#0B1120',
            brandSurface: '#111827',
            brandBorder: '#1F2937',
            brandCyan: '#06B6D4',
            brandViolet: '#8B5CF6',
            brandSuccess: '#10B981',
            brandWarning: '#F59E0B',
            brandError: '#EF4444',
            brandTextPrimary: '#F9FAFB',
            brandTextSecondary: '#9CA3AF'
          }
        }
      }
    }
  </script>
</head>
<body class="text-brandTextPrimary min-h-screen relative">
  <!-- Three.js Background Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Main Container -->
  <div class="max-w-[1100px] mx-auto px-4 py-8 relative z-10">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-brandCyan to-brandViolet mb-2">
        CompetitorScope
      </h1>
      <p class="text-brandTextSecondary text-lg font-medium max-w-xl mx-auto">
        Local competitor intelligence tool. Discover software & IT companies building products for specific business domains.
      </p>
    </header>

    <!-- Search Section -->
    <section class="bg-brandSurface/80 backdrop-blur-md border border-brandBorder p-6 rounded-2xl shadow-2xl mb-8">
      <form id="search-form" class="flex flex-col md:flex-row gap-4">
        <!-- Business Domain -->
        <div class="flex-1">
          <label for="business-type" class="block text-xs font-semibold uppercase tracking-wider text-brandTextSecondary mb-2">Business Domain</label>
          <input type="text" id="business-type" value="restaurant" required placeholder="e.g. restaurant, hospital, retail" 
            class="w-full bg-brandBg border border-brandBorder px-4 py-3 rounded-lg text-brandTextPrimary focus:outline-none focus:border-brandCyan transition-colors">
        </div>

        <!-- State -->
        <div class="w-full md:w-56">
          <label for="state" class="block text-xs font-semibold uppercase tracking-wider text-brandTextSecondary mb-2">State / Region</label>
          <select id="state" required 
            class="w-full bg-brandBg border border-brandBorder px-4 py-3 rounded-lg text-brandTextPrimary focus:outline-none focus:border-brandCyan transition-colors cursor-pointer">
            <option value="AP">Andhra Pradesh (AP)</option>
            <option value="AR">Arunachal Pradesh (AR)</option>
            <option value="AS">Assam (AS)</option>
            <option value="BR">Bihar (BR)</option>
            <option value="CG">Chhattisgarh (CG)</option>
            <option value="GA">Goa (GA)</option>
            <option value="GJ">Gujarat (GJ)</option>
            <option value="HR">Haryana (HR)</option>
            <option value="HP">Himachal Pradesh (HP)</option>
            <option value="JH">Jharkhand (JH)</option>
            <option value="KA">Karnataka (KA)</option>
            <option value="KL">Kerala (KL)</option>
            <option value="MP" selected>Madhya Pradesh (MP)</option>
            <option value="MH">Maharashtra (MH)</option>
            <option value="MN">Manipur (MN)</option>
            <option value="ML">Meghalaya (ML)</option>
            <option value="MZ">Mizoram (MZ)</option>
            <option value="NL">Nagaland (NL)</option>
            <option value="OR">Odisha (OR)</option>
            <option value="PB">Punjab (PB)</option>
            <option value="RJ">Rajasthan (RJ)</option>
            <option value="SK">Sikkim (SK)</option>
            <option value="TN">Tamil Nadu (TN)</option>
            <option value="TG">Telangana (TG)</option>
            <option value="TR">Tripura (TR)</option>
            <option value="UP">Uttar Pradesh (UP)</option>
            <option value="UK">Uttarakhand (UK)</option>
            <option value="WB">West Bengal (WB)</option>
            <option value="AN">Andaman & Nicobar (AN)</option>
            <option value="CH">Chandigarh (CH)</option>
            <option value="DN">Dadra & Nagar Haveli (DN)</option>
            <option value="DL">Delhi (DL)</option>
            <option value="JK">Jammu & Kashmir (JK)</option>
            <option value="LA">Ladakh (LA)</option>
            <option value="LD">Lakshadweep (LD)</option>
            <option value="PY">Puducherry (PY)</option>
          </select>
        </div>

        <!-- City -->
        <div class="w-full md:w-56">
          <label for="city" class="block text-xs font-semibold uppercase tracking-wider text-brandTextSecondary mb-2">City</label>
          <input type="text" id="city" value="Indore" required placeholder="e.g. Indore, Pune, Mumbai" 
            class="w-full bg-brandBg border border-brandBorder px-4 py-3 rounded-lg text-brandTextPrimary focus:outline-none focus:border-brandCyan transition-colors">
        </div>

        <!-- Search Button -->
        <div class="flex items-end">
          <button type="submit" id="search-btn" class="w-full md:w-auto bg-brandCyan hover:bg-brandCyan/80 text-brandBg font-bold px-8 py-3.5 rounded-lg shadow-lg shadow-brandCyan/10 hover:shadow-brandCyan/20 transition-all duration-300 whitespace-nowrap">
            Analyze Competitors
          </button>
        </div>
      </form>
    </section>

    <!-- Results Section -->
    <main>
      <div id="results-count" class="hidden mb-4 text-brandTextSecondary text-sm font-semibold tracking-wide uppercase"></div>
      
      <!-- List container for company cards -->
      <div id="results-list" class="space-y-4">
        <!-- Landing State Info -->
        <div class="text-center py-16 border border-dashed border-brandBorder rounded-2xl bg-brandSurface/20 backdrop-blur-sm">
          <svg class="mx-auto h-12 w-12 text-brandTextSecondary mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <h3 class="text-lg font-bold text-brandTextPrimary mb-1">Begin Market Analysis</h3>
          <p class="text-brandTextSecondary text-sm max-w-sm mx-auto">
            Input a business domain (e.g. "restaurant") and local city to find tech companies building local solutions.
          </p>
        </div>
      </div>
    </main>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Scene Script (3D Background) -->
  <script src="scene.js"></script>
  <!-- UI Logic Script -->
  <script src="main.js"></script>
</body>
</html>
